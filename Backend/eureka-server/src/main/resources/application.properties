spring.application.name=eureka-server
server.port=8761

# Mode isole (un seul serveur) : ne pas s'auto-enregistrer ni recuperer un registre.
# Pour la haute disponibilite, lancer avec --spring.profiles.active=peer1 ou peer2
# (voir application-peer1.properties et application-peer2.properties).
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

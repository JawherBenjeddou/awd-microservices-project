spring.application.name=eureka-server
server.port=8762
eureka.instance.hostname=localhost

# Pair 2 (8762). Chaque pair connait TOUS les pairs : Eureka filtre sa propre URL.
# my-url force une comparaison exacte : sans lui, Eureka compare uniquement les
# hostnames ("localhost") et filtrerait aussi le pair distant.
eureka.server.my-url=http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.registry-fetch-interval-seconds=5

# Rafraichir rapidement la liste des pairs (defaut : 10 minutes)
eureka.server.peer-eureka-nodes-update-interval-ms=10000
eureka.server.wait-time-in-ms-when-sync-empty=1000

# Demo : detection rapide des instances perdues (UP -> DOWN visible)
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

spring.application.name=vehicle-sales-service
server.port=${PORT:8081}

# MySQL (XAMPP: user root, empty password)
spring.datasource.url=jdbc:mysql://localhost:3306/sales_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Eureka (both peers)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka,http://localhost:8762/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true
info.app.name=vehicle-sales-service
info.app.version=1.0.0
info.app.description=MS1 - Vente de vehicules (AutoWorld)
info.app.owner=Jawher Benjeddou

# Part 3, method 2: dynamic routes. lb:// asks Eureka for the instances of the service.
spring.cloud.gateway.server.webflux.routes[0].id=vehicle-sales
spring.cloud.gateway.server.webflux.routes[0].uri=lb://vehicle-sales-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/vehicle-sales/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
